<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FAF8F5">
    <title>Inventory KK</title>
    
    <!-- Ubah path ini agar mengarah ke style.css yang ada di repo Anda -->
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <!-- LAYER LOGIN -->
    <div id="login-view" class="view-layer active">
        <div class="login-container">
            <div class="brand-logo">
                <h1>Inventory KK</h1>
                <p>Operational System</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Username / Email</label>
                    <input type="text" id="username" autocomplete="username" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
        </div>
    </div>

    <!-- LAYER APLIKASI UTAMA -->
    <div id="app-view" class="view-layer hidden">
        <header class="app-header">
            <h2 id="page-title">Dashboard</h2>
            <button id="btn-profile" class="icon-btn">👤</button>
        </header>

        <main id="main-content" class="content-scrollable">
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-target="dashboard">
                <span class="icon">📊</span>
                <span>Dashboard</span>
            </button>
            <button class="nav-item" data-target="inventory">
                <span class="icon">📦</span>
                <span>Inventory</span>
            </button>
            <button class="nav-item" data-target="operations">
                <span class="icon">📝</span>
                <span>Operations</span>
            </button>
        </nav>
    </div>

    <!-- Ubah path ini agar mengarah ke app.js di repo Anda -->
    <script type="module" src="app.js"></script>
</body>
</html>
